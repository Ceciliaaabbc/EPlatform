spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      url: ${REDIS_URL}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

frontend:
  url: ${FRONTEND_URL}

order:
  expiration-minutes: ${ORDER_EXPIRATION_MINUTES:30}

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:local-placeholder-bucket}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis is used only as an optional cache in this app, not a hard
    # dependency. Without this, Render's deploy health check (and any
    # load balancer probe) reports the whole service as DOWN whenever the
    # Redis instance is unreachable/misconfigured, even though the API,
    # database, and everything else work fine. Keep the app's health
    # check tied to things that actually make it non-functional.
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
