name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_API_BASE_URL: https://ecommerce-project-1-qw1m.onrender.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check backend API
        run: |
          echo "API=$VITE_API_BASE_URL"
          curl -i "$VITE_API_BASE_URL/api/products"

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
